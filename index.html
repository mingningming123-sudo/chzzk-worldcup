<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>치지직 이상형 월드컵</title>
<style>
  :root {
    --bg: #0f0f14;
    --panel: #1a1a24;
    --panel2: #22222e;
    --accent: #7c5cff;
    --accent2: #ff5c8a;
    --text: #f0f0f5;
    --muted: #9a9ab0;
    --border: #2e2e3e;
  }
  * { box-sizing: border-box; }
  body[data-theme="dark"] { --bg: #0f0f14; --panel: #1a1a24; --panel2: #22222e; --border: #2e2e3e; --text: #f0f0f5; --muted: #9a9ab0; }
  body[data-theme="light"] { --bg: #f5f5f8; --panel: #ffffff; --panel2: #ececf2; --border: #dcdce4; --text: #1a1a24; --muted: #6a6a80; }
  body[data-theme="naver"] { --bg: #0c1c2b; --panel: #122436; --panel2: #1a3148; --border: #234258; --text: #eaf2fb; --muted: #8aa6c2; }
  body[data-theme="chzzk"] { --bg: #1a0f2e; --panel: #261840; --panel2: #2f1f4d; --border: #3d2a5e; --text: #f3eaff; --muted: #b39dd6; }
  body[data-theme="sunset"] { --bg: #2a0f1f; --panel: #3d1a2d; --panel2: #4a2238; --border: #5c2f47; --text: #ffeaf3; --muted: #d6a3b8; }
  body[data-theme="forest"] { --bg: #0f1f15; --panel: #182a1f; --panel2: #1f3527; --border: #2a4533; --text: #eaf6ee; --muted: #8ab89a; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; min-height: 100vh; transition: background .2s; }
  a { color: var(--accent); }
  button { font-family: inherit; cursor: pointer; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 28px; margin: 8px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  label { font-size: 14px; color: var(--muted); }
  .sizes { display: flex; gap: 8px; flex-wrap: wrap; }
  .size-btn {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 16px; font-size: 15px; font-weight: 600;
    transition: all .15s;
  }
  .size-btn:hover { border-color: var(--accent); }
  .size-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  textarea {
    width: 100%; min-height: 220px; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 14px;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace; resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  input[type=text] {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font-size: 15px; width: 100%;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  .hint { color: var(--muted); font-size: 13px; margin-top: 8px; line-height: 1.6; }
  .hint code { background: var(--panel2); padding: 1px 6px; border-radius: 4px; }
  .primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
    border: none; border-radius: 12px; padding: 14px 28px; font-size: 17px; font-weight: 700;
    box-shadow: 0 6px 20px rgba(124,92,255,.3);
  }
  .primary:hover { filter: brightness(1.08); }
  .primary:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
  .ghost {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 600;
  }
  .ghost:hover { border-color: var(--accent); }
  .err { color: #ff6b81; font-size: 14px; margin-top: 10px; }
  .count { color: var(--muted); font-size: 14px; }

  .share-box { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-top: 14px; }
  .share-box .share-url { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 13px; font-family: ui-monospace, Consolas, monospace; word-break: break-all; }
  .share-box .share-url:focus { outline: none; border-color: var(--accent); }
  .copied { color: #4ade80; font-size: 13px; margin-left: 8px; }

  /* ===== Tournament ===== */
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .round-title { font-size: 22px; font-weight: 700; margin: 0; }
  .progress { color: var(--muted); font-size: 14px; }
  .match-arena { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 760px) { .match-arena { grid-template-columns: 1fr; } }
  .player {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; display: flex; flex-direction: column; transition: all .2s;
  }
  .player:hover { border-color: var(--accent); transform: translateY(-2px); }
  .player .video { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
  .player .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .player .meta { padding: 14px 16px; }
  .player .name { font-size: 17px; font-weight: 700; margin: 0 0 10px; word-break: break-word; }
  .pick {
    width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 16px; font-weight: 700;
  }
  .pick:hover { filter: brightness(1.1); }
  .vs { text-align: center; font-size: 28px; font-weight: 800; color: var(--muted); margin: 10px 0; }
  @media (max-width: 760px) { .vs { display: none; } }

  .bracket-mini { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .pip { width: 10px; height: 10px; border-radius: 50%; background: var(--panel2); border: 1px solid var(--border); }
  .pip.done { background: var(--accent); border-color: var(--accent); }
  .pip.cur { background: var(--accent2); border-color: var(--accent2); }

  /* ===== Welcome ===== */
  .welcome { text-align: center; padding: 60px 20px; }
  .welcome h1 { font-size: 36px; margin-bottom: 8px; }
  .welcome .gift-from { color: var(--muted); font-size: 16px; margin-bottom: 30px; }
  .welcome .gift-title { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .welcome .info { color: var(--muted); margin: 20px 0 30px; }
  .welcome .start-big { font-size: 20px; padding: 18px 40px; }

  /* ===== Winner ===== */
  .winner-card { text-align: center; padding: 40px 20px; }
  .winner-card h2 { font-size: 36px; margin: 0 0 8px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .winner-card .crown { font-size: 48px; }
  .winner-video { max-width: 720px; margin: 24px auto; position: relative; padding-top: 56.25%; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); }
  .winner-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .hidden { display: none; }
</style>
</head>
<body data-theme="dark">
<div class="wrap">

  <!-- ===== Setup Screen ===== -->
  <section id="setup">
    <h1>🏆 치지직 이상형 월드컵 만들기</h1>
    <p class="sub">치지직 클립 링크로 월드컵을 만들고, 공유 링크를 선물하세요.</p>

    <div class="card">
      <label><strong>월드컵 제목</strong> (선택)</label>
      <input type="text" id="cup-title" placeholder="예: 치지직 클립 월드컵" style="margin-top: 8px; margin-bottom: 16px;" />

      <div class="row" style="margin-bottom: 16px;">
        <label><strong>규모 선택</strong></label>
        <div class="sizes" id="sizes">
          <button class="size-btn" data-size="8">8강</button>
          <button class="size-btn" data-size="16">16강</button>
          <button class="size-btn active" data-size="32">32강</button>
          <button class="size-btn" data-size="64">64강</button>
        </div>
      </div>

      <div class="row" style="margin-bottom: 16px;">
        <label><strong>배경 테마</strong></label>
        <div class="sizes" id="themes">
          <button class="size-btn theme-btn active" data-theme="dark">🌙 다크</button>
          <button class="size-btn theme-btn" data-theme="light">☀️ 라이트</button>
          <button class="size-btn theme-btn" data-theme="naver">🟦 네이버</button>
          <button class="size-btn theme-btn" data-theme="chzzk">🟣 치지직</button>
          <button class="size-btn theme-btn" data-theme="sunset">🌅 선셋</button>
          <button class="size-btn theme-btn" data-theme="forest">🌲 포레스트</button>
        </div>
      </div>

      <label><strong>클립 링크 입력</strong> &nbsp;<span class="count" id="count"></span></label>
      <textarea id="links" placeholder="한 줄에 한 명씩. 두 형식 모두 가능:

이름 | https://chzzk.naver.com/clips/sezEObMeD5
https://chzzk.naver.com/clips/PlOjsUItho

이름을 적지 않으면 '참가자 N'으로 자동 지정됩니다."></textarea>
      <p class="hint">
        링크는 <code>https://chzzk.naver.com/clips/아이디</code> 형식이어야 합니다.<br>
        규모에 맞는 개수만큼 입력해 주세요. (예: 32강 → 32개)
      </p>
      <div id="err" class="err hidden"></div>
      <div class="row" style="margin-top: 18px; justify-content: flex-end;">
        <button class="ghost" id="shuffle-preview">🔀 섞기</button>
        <button class="primary" id="make-share">공유 링크 만들기</button>
      </div>

      <div id="share-result" class="share-box hidden">
        <label><strong>🎁 공유 링크 (이걸 선물하세요)</strong></label>
        <textarea class="share-url" id="share-url" readonly rows="3"></textarea>
        <div class="row" style="margin-top: 10px;">
          <button class="ghost" id="copy-share">📋 링크 복사</button>
          <button class="ghost" id="open-share">🔗 새 탭에서 열어보기</button>
          <span id="copied-msg" class="copied hidden">복사됨!</span>
        </div>
        <p class="hint">이 링크를 카톡/디스코드/메일 등으로 보내면, 상대방이 클릭만 하면 바로 월드컵이 시작됩니다.</p>
      </div>
    </div>
  </section>

  <!-- ===== Welcome Screen ===== -->
  <section id="welcome" class="hidden">
    <div class="welcome">
      <div style="font-size: 56px;">🏆</div>
      <h1 class="gift-title" id="welcome-title">이상형 월드컵</h1>
      <p class="gift-from" id="welcome-from"></p>
      <p class="info" id="welcome-info">두 클립 중 더 마음에 드는 쪽을 선택하세요.<br>토너먼트로 진행되며, 최종 우승 클립을 가리게 됩니다.</p>
      <button class="primary start-big" id="welcome-start">월드컵 시작 🎬</button>
    </div>
  </section>

  <!-- ===== Tournament Screen ===== -->
  <section id="tournament" class="hidden">
    <div class="topbar">
      <div>
        <h2 class="round-title" id="round-title">32강</h2>
        <div class="progress" id="progress"></div>
        <div class="bracket-mini" id="pips"></div>
      </div>
      <div class="row">
        <button class="ghost" id="restart">↺ 처음부터</button>
      </div>
    </div>
    <div class="match-arena" id="arena"></div>
    <div class="vs">VS</div>
  </section>

  <!-- ===== Winner Screen ===== -->
  <section id="winner" class="hidden">
    <div class="winner-card">
      <div class="crown">👑</div>
      <h2 id="winner-name">우승자</h2>
      <p class="sub">최종 우승!</p>
      <div class="winner-video" id="winner-video"></div>
      <div class="row" style="justify-content: center;">
        <button class="ghost" id="again">다시 하기</button>
      </div>
    </div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
<script>
(function () {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const setupEl = $("setup"), welcomeEl = $("welcome"), tourEl = $("tournament"), winEl = $("winner");
  const sizesEl = $("sizes"), linksEl = $("links"), countEl = $("count"), errEl = $("err");
  const cupTitleEl = $("cup-title");
  const makeShareBtn = $("make-share"), shuffleBtn = $("shuffle-preview");
  const shareResultEl = $("share-result"), shareUrlEl = $("share-url"), copyShareBtn = $("copy-share"), openShareBtn = $("open-share"), copiedMsgEl = $("copied-msg");
  const welcomeTitleEl = $("welcome-title"), welcomeFromEl = $("welcome-from"), welcomeInfoEl = $("welcome-info"), welcomeStartBtn = $("welcome-start");
  const arenaEl = $("arena"), roundTitleEl = $("round-title"), progressEl = $("progress"), pipsEl = $("pips");
  const restartBtn = $("restart"), againBtn = $("again");
  const winnerNameEl = $("winner-name"), winnerVideoEl = $("winner-video");

  let bracketSize = 32;
  let currentTheme = "dark";
  let participants = [];
  let rounds = [], curRound = 0, curMatch = 0, results = [];
  let giftData = null;

  const ROUND_NAMES = { 2: "결승", 4: "4강", 8: "8강", 16: "16강", 32: "32강", 64: "64강" };

  // ===== 인코딩/디코딩 (LZ-string + 짧은 키) =====
  function encodeGift(data) {
    const compact = {
      t: data.title || "",
      s: data.size || data.clips.length,
      th: data.theme || "dark",
      c: data.clips.map(p => p.name && !/^참가자 \d+$/.test(p.name) ? [p.name, p.clipId] : p.clipId)
    };
    if (data.from) compact.f = data.from;
    const json = JSON.stringify(compact);
    return LZString.compressToEncodedURIComponent(json);
  }
  function decodeGift(str) {
    try {
      const json = LZString.decompressFromEncodedURIComponent(str);
      if (!json) return null;
      const c = JSON.parse(json);
      const clips = (c.c || []).map((item, i) => {
        if (Array.isArray(item)) return { name: item[0], clipId: item[1] };
        return { name: `참가자 ${i + 1}`, clipId: item };
      });
      return { title: c.t || "", from: c.f || "", size: c.s, theme: c.th || "dark", clips };
    } catch (e) { return null; }
  }

  function loadFromHash() {
    const hash = location.hash.replace(/^#/, "");
    if (!hash) return false;
    const data = decodeGift(hash);
    if (!data || !data.clips || data.clips.length < 2) return false;
    giftData = data;
    showWelcome(data);
    return true;
  }

  function showWelcome(data) {
    setupEl.classList.add("hidden");
    welcomeEl.classList.remove("hidden");
    if (data.theme) applyTheme(data.theme);
    welcomeTitleEl.textContent = data.title || "이상형 월드컵";
    if (data.from) welcomeFromEl.textContent = `from. ${data.from} 님의 선물 🎁`;
    else welcomeFromEl.textContent = "";
    const n = data.clips.length;
    welcomeInfoEl.innerHTML = `총 ${n}개 클립 · ${ROUND_NAMES[n] || n + "강"} 토너먼트<br>두 클립 중 더 마음에 드는 쪽을 선택하세요. 최종 우승 클립을 가리게 됩니다.`;
  }

  welcomeStartBtn.addEventListener("click", () => {
    if (giftData) startTournament(giftData.clips.slice());
  });

  // ===== 주최자: 입력 =====
  sizesEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".size-btn");
    if (!btn || !btn.dataset.size) return;
    [...sizesEl.children].forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    bracketSize = parseInt(btn.dataset.size, 10);
    updateCount();
  });

  const themesEl = $("themes");
  function applyTheme(theme) {
    currentTheme = theme;
    document.body.setAttribute("data-theme", theme);
  }
  themesEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".theme-btn");
    if (!btn) return;
    [...themesEl.children].forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    applyTheme(btn.dataset.theme);
  });

  function extractClipId(line) {
    const m = line.match(/chzzk\.naver\.com\/clips\/([A-Za-z0-9]+)/);
    if (m) return m[1];
    if (/^[A-Za-z0-9]{6,}$/.test(line.trim())) return line.trim();
    return null;
  }

  function parseInput() {
    const lines = linksEl.value.split("\n").map(l => l.trim()).filter(Boolean);
    const list = [];
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      let name = "", urlPart = line;
      if (line.includes("|")) {
        const [n, ...rest] = line.split("|");
        name = n.trim();
        urlPart = rest.join("|").trim();
      } else if (line.includes("\t")) {
        const [n, ...rest] = line.split("\t");
        name = n.trim();
        urlPart = rest.join("\t").trim();
      }
      const clipId = extractClipId(urlPart);
      if (!clipId) continue;
      list.push({ name: name || `참가자 ${list.length + 1}`, clipId });
    }
    return list;
  }

  function updateCount() {
    const list = parseInput();
    const need = bracketSize;
    let msg = `입력됨: ${list.length} / ${need}`;
    if (list.length > need) msg += ` (초과 ${list.length - need}개는 제외)`;
    countEl.textContent = msg;
    countEl.style.color = list.length >= need ? "#7c5cff" : "var(--muted)";
  }
  linksEl.addEventListener("input", updateCount);

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  shuffleBtn.addEventListener("click", () => {
    const list = parseInput();
    shuffle(list);
    linksEl.value = list.map(p => `${p.name} | https://chzzk.naver.com/clips/${p.clipId}`).join("\n");
    updateCount();
  });

  function showError(msg) { errEl.textContent = msg; errEl.classList.remove("hidden"); }
  function clearError() { errEl.classList.add("hidden"); }

  makeShareBtn.addEventListener("click", async () => {
    clearError();
    const list = parseInput();
    if (list.length < 2) { showError("최소 2개의 클립 링크를 입력해 주세요."); return; }
    if (list.length < bracketSize) {
      showError(`규모(${bracketSize}강)에 맞는 링크가 부족합니다. 현재 ${list.length}개. 더 입력하거나 규모를 줄여 보세요.`);
      return;
    }
    const picked = shuffle(list.slice()).slice(0, bracketSize);
    const title = cupTitleEl.value.trim() || "치지직 클립 이상형 월드컵";
    const data = { title, from: "", size: bracketSize, theme: currentTheme, clips: picked };
    const encoded = encodeGift(data);
    const base = location.href.split("#")[0];
    const longUrl = base + "#" + encoded;

    shareUrlEl.value = longUrl;
    shareResultEl.classList.remove("hidden");
    shareResultEl.scrollIntoView({ behavior: "smooth", block: "nearest" });

    try {
      makeShareBtn.disabled = true;
      makeShareBtn.textContent = "단축 중...";
      const shortUrl = await shortenUrl(longUrl);
      if (shortUrl) shareUrlEl.value = shortUrl;
    } catch (e) {} finally {
      makeShareBtn.disabled = false;
      makeShareBtn.textContent = "공유 링크 만들기";
    }
  });

  async function shortenUrl(url) {
    try {
      const res = await fetch("https://shrtr.top/api/v1/shorten", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url })
      });
      if (res.ok) {
        const data = await res.json();
        if (data && data.short_url) return data.short_url;
      }
    } catch (e) {}
    try {
      const res = await fetch("https://tinyurl.com/api-create.php?url=" + encodeURIComponent(url));
      if (res.ok) {
        const text = (await res.text()).trim();
        if (/^https?:\/\//.test(text)) return text;
      }
    } catch (e) {}
    try {
      const res = await fetch("https://is.gd/create.php?format=simple&url=" + encodeURIComponent(url));
      if (res.ok) {
        const text = (await res.text()).trim();
        if (/^https?:\/\//.test(text)) return text;
      }
    } catch (e) {}
    return null;
  }

  copyShareBtn.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(shareUrlEl.value); }
    catch (e) { shareUrlEl.select(); document.execCommand("copy"); }
    copiedMsgEl.classList.remove("hidden");
    setTimeout(() => copiedMsgEl.classList.add("hidden"), 1800);
  });

  openShareBtn.addEventListener("click", () => window.open(shareUrlEl.value, "_blank"));

  // ===== 토너먼트 =====
  function startTournament(seeded) {
    participants = seeded;
    const firstRound = [];
    for (let i = 0; i < seeded.length; i += 2) firstRound.push([seeded[i], seeded[i + 1]]);
    rounds = [firstRound]; results = []; curRound = 0; curMatch = 0;
    setupEl.classList.add("hidden"); welcomeEl.classList.add("hidden"); winEl.classList.add("hidden");
    tourEl.classList.remove("hidden");
    renderMatch();
  }

  function embedUrl(clipId) {
    return `https://chzzk.naver.com/embed/clip/${clipId}`;
  }

  function renderMatch() {
    const round = rounds[curRound];
    if (curMatch >= round.length) { advanceRound(); return; }
    const match = round[curMatch];
    if (match.length === 1) { recordWinner(match[0]); return; }
    const [a, b] = match;
    const participantsInRound = round.reduce((sum, m) => sum + m.length, 0);
    roundTitleEl.textContent = ROUND_NAMES[participantsInRound] || `${participantsInRound}강`;
    progressEl.textContent = `${curMatch + 1} / ${round.length} 매치`;
    renderPips();
    arenaEl.innerHTML = "";
    arenaEl.appendChild(playerCard(a));
    arenaEl.appendChild(playerCard(b));
  }

  function playerCard(p) {
    const card = document.createElement("div");
    card.className = "player";
    card.innerHTML = `
      <div class="video"><iframe src="${embedUrl(p.clipId)}" allow="autoplay; fullscreen; encrypted-media" allowfullscreen scrolling="no"></iframe></div>
      <div class="meta">
        <p class="name">${escapeHtml(p.name)}</p>
        <button class="pick">이쪽 선택 👈</button>
      </div>`;
    card.querySelector(".pick").addEventListener("click", () => recordWinner(p));
    return card;
  }

  function recordWinner(p) {
    if (!results[curRound]) results[curRound] = [];
    results[curRound].push(p);
    curMatch++;
    renderMatch();
  }

  function advanceRound() {
    const winners = results[curRound];
    if (winners.length === 1) { showWinner(winners[0]); return; }
    const next = [];
    for (let i = 0; i < winners.length; i += 2) {
      if (winners[i + 1]) next.push([winners[i], winners[i + 1]]);
      else next.push([winners[i]]);
    }
    rounds.push(next); curRound++; curMatch = 0;
    renderMatch();
  }

  function renderPips() {
    const round = rounds[curRound];
    pipsEl.innerHTML = "";
    for (let i = 0; i < round.length; i++) {
      const pip = document.createElement("span");
      pip.className = "pip" + (i < curMatch ? " done" : (i === curMatch ? " cur" : ""));
      pipsEl.appendChild(pip);
    }
  }

  function showWinner(p) {
    tourEl.classList.add("hidden");
    winEl.classList.remove("hidden");
    winnerNameEl.textContent = p.name;
    winnerVideoEl.innerHTML = `<iframe src="${embedUrl(p.clipId)}" allow="autoplay; fullscreen; encrypted-media" allowfullscreen scrolling="no"></iframe>`;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  restartBtn.addEventListener("click", () => { if (participants.length) startTournament(participants.slice()); });
  againBtn.addEventListener("click", () => { if (participants.length) startTournament(shuffle(participants.slice())); });

  if (!loadFromHash()) updateCount();
})();
</script>
</body>
</html>
